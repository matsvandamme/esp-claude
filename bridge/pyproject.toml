[project]
name = "claude-display"
version = "0.1.0"
description = "Bridge between Claude Code sessions and the esp-claude ESP32-C6 status display"
requires-python = "==3.13.*"
dependencies = ["pyserial>=3.5", "pillow>=11"]

[dependency-groups]
dev = ["pytest>=8", "pexpect>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_display"]

[tool.pytest.ini_options]
testpaths = ["tests"]
